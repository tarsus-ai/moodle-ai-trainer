# Publishes a GitHub release for every version in CHANGELOG.md that has no
# tag yet: set $plugin->release in version.php, add the changelog section,
# push to main - and the tag, the plugin zip and the release appear.
name: Release

on:
  push:
    branches: [main]
    paths:
      - version.php
      - CHANGELOG.md
      - .github/workflows/release.yml
      - .github/scripts/release.sh
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Build a published version again, e.g. v1.0.0: its release and tag are deleted first, then it is built from the newest commit that declares it"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, build and publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
        run: bash .github/scripts/release.sh
